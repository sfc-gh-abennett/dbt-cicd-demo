# CI: every pull request into main builds + tests the changed models in TEST,
# in an isolated schema (PR_<number>), then drops it.
name: dbt CI (TEST)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: SVC_DBT_GITHUB
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  DBT_PROFILES_DIR: .
  DBT_TEST_SCHEMA: PR_${{ github.event.pull_request.number || github.run_id }}

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-snowflake~=1.9"

      - name: dbt debug
        run: dbt debug --target test

      - name: Fetch prod manifest (for Slim CI)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: dbt_cd_prod.yml
          name: prod-manifest
          path: prod-state

      - name: dbt build (changed models only, deferring to prod)
        run: |
          if [ -f prod-state/manifest.json ]; then
            dbt build --target test --select state:modified+ --defer --state prod-state
          else
            echo "No prod manifest yet - building everything"
            dbt build --target test
          fi

      - name: Drop PR schemas
        if: always()
        run: |
          dbt run-operation drop_ci_schemas --target test \
            --args "{prefix: '${DBT_TEST_SCHEMA}'}"
